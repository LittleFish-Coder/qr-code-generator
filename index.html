<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="data:," />
    <meta name="description" content="簡單的 QR Code 產生器。" />
    <title>QR Code Generator</title>
  </head>
  <body>
    <a class="skip-link" href="#controls">跳至設定</a>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="QR Code Generator 首頁">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>QR Code Generator</span>
      </a>
    </header>

    <main id="top">
      <div class="workspace">
        <form id="controls" class="control-panel" novalidate>
          <section class="panel-section" aria-labelledby="content-heading">
            <h1 id="content-heading">建立 QR Code</h1>
            <label for="qr-data">網址或文字</label>
            <textarea id="qr-data" rows="3" maxlength="2000" aria-describedby="data-help data-error">https://example.com</textarea>
            <div class="field-meta"><span id="data-help">輸入網址或任何文字。</span><span id="char-count">19 / 2000</span></div>
            <p id="data-error" class="field-error" role="alert" hidden></p>
          </section>

          <section class="panel-section" aria-labelledby="logo-heading">
            <h2 id="logo-heading">中央圖片 <span>（選填）</span></h2>
            <input id="logo-file" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" />
            <label class="upload-box" for="logo-file">
              <span class="upload-icon" aria-hidden="true">↑</span>
              <span><strong>上傳圖片</strong><small>PNG、JPG、WebP 或 SVG</small></span>
            </label>
            <div id="logo-summary" class="logo-summary" hidden>
              <img id="logo-thumb" alt="已上傳標誌預覽" />
              <span id="logo-name"></span>
              <button id="remove-logo" type="button">移除</button>
            </div>
            <p id="file-error" class="field-error" role="alert" hidden></p>
          </section>

          <section class="panel-section" aria-labelledby="style-heading">
            <h2 id="style-heading">顏色</h2>
            <div class="style-grid">
              <fieldset>
                <legend>QR Code</legend>
                <div class="choice-group">
                  <label class="color-choice"><input name="qr-color" type="radio" value="black" checked /><span class="swatch black"></span>黑色</label>
                  <label class="color-choice"><input name="qr-color" type="radio" value="white" /><span class="swatch white"></span>白色</label>
                </div>
              </fieldset>
              <fieldset>
                <legend>背景</legend>
                <div class="choice-group">
                  <label class="color-choice"><input name="qr-background" type="radio" value="white" checked /><span class="swatch white"></span>白色</label>
                  <label class="color-choice"><input name="qr-background" type="radio" value="black" /><span class="swatch black"></span>黑色</label>
                  <label class="color-choice"><input name="qr-background" type="radio" value="transparent" /><span class="swatch transparent"></span>透明</label>
                </div>
              </fieldset>
            </div>
            <label class="size-control">尺寸 <output id="size-output" for="qr-size">320 px</output><input id="qr-size" type="range" min="200" max="800" step="20" value="320" /></label>
          </section>

          <div class="form-actions">
            <button id="reset" class="button button-secondary" type="reset">重設全部</button>
          </div>
        </form>

        <aside class="preview-panel" aria-labelledby="preview-title">
          <div class="preview-heading"><h2 id="preview-title">預覽</h2><span id="preview-size">320 × 320</span></div>
          <div id="qr-stage" class="qr-stage" aria-label="QR Code 預覽"></div>
          <p id="status" class="status" role="status" aria-live="polite">QR Code 已更新</p>
          <div class="download-actions">
            <button id="download-png" class="button button-primary" type="button">下載 PNG</button>
            <button id="download-jpeg" class="button button-secondary" type="button">下載 JPEG</button>
          </div>
        </aside>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
